<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="logo.png">
<title>StreamClipper — код авторизації</title>
<style>
  :root { color-scheme: light dark; }
  body { max-width: 34rem; margin: 3rem auto; padding: 0 1.25rem; text-align: center;
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .logo { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 1.35rem; margin: 1.5rem 0 .5rem; }
  p  { color: #777; }
  #code { display: block; width: 100%; box-sizing: border-box; margin: 1.5rem 0 .75rem;
          padding: 1rem; font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
          word-break: break-all; border: 2px solid #888; border-radius: 12px;
          background: transparent; color: inherit; text-align: center; }
  button { font-size: 1rem; padding: .7rem 1.4rem; border-radius: 10px;
           border: 0; background: #6d4cff; color: #fff; cursor: pointer; }
  button:active { opacity: .8; }
  .hint { margin-top: 2rem; font-size: .95rem; }
  code { background: rgba(128,128,128,.18); padding: .15rem .4rem; border-radius: 5px; }
  .error { color: #d33; }
</style>
</head>
<body>
<img class="logo" src="logo.png" alt="">
<h1 id="title">Код авторизації</h1>
<p id="subtitle">Скопіюй його й надішли боту.</p>

<textarea id="code" rows="3" readonly></textarea>
<button id="copy">Скопіювати</button>

<p class="hint">Надішли боту: <code id="cmd">/connect tiktok code &lt;код&gt;</code></p>

<script>
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const error = params.get("error_description") || params.get("error");
  const box = document.getElementById("code");

  if (code) {
    box.value = code;
    document.getElementById("cmd").textContent = "/connect tiktok code " + code;
  } else {
    document.getElementById("title").textContent = error ? "TikTok відмовив" : "Коду немає";
    document.getElementById("title").className = "error";
    document.getElementById("subtitle").textContent = error
      || "Ця сторінка відкривається сама після дозволу в TikTok.";
    box.style.display = "none";
    document.getElementById("copy").style.display = "none";
  }

  document.getElementById("copy").onclick = async () => {
    const text = document.getElementById("cmd").textContent;
    try { await navigator.clipboard.writeText(text); }
    catch { box.select(); document.execCommand("copy"); }
    document.getElementById("copy").textContent = "Скопійовано ✓";
  };
</script>
</body>
</html>
